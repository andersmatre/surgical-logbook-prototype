# Fly.io settings for the logbook server. Not run by its author before the first real deploy.
# Keep it to ONE machine: the database is a single SQLite file on one volume.
app = "capacare-logbook"
primary_region = "arn"   # Stockholm

[build]

[env]
  PORT = "8080"
  LOGBOOK_DB = "/data/logbook.db"

[mounts]
  source = "logbook_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
